name: Build APK Absen Guru Nurul Islam
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Amankan Semua File & Bangun Struktur Flutter
        run: |
          mkdir -p /tmp/backup_app
          find . -type f -name "main.dart" -exec cp {} /tmp/backup_app/main.dart \;
          find . -type f -name "pubspec.yaml" -exec cp {} /tmp/backup_app/pubspec.yaml \;
          find . -type f -name "AndroidManifest.xml" -exec cp {} /tmp/backup_app/AndroidManifest.xml \;

          rm -rf lib android test ios web windows linux macos pubspec.yaml pubspec.lock
          flutter create . --project-name absen_guru_nurul_islam

          cp /tmp/backup_app/main.dart lib/main.dart
          cp /tmp/backup_app/pubspec.yaml pubspec.yaml
          cp /tmp/backup_app/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Absen-Guru-Yayasan-Nurul-Islam
          path: build/app/outputs/flutter-apk/app-release.apk
