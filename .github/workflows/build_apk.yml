name: Build APK Absen Guru Nurul Islam
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Amankan Kode Aplikasi & Generate Struktur Android
        run: |
          mkdir -p /tmp/backup_app
          cp lib/main.dart /tmp/backup_app/main.dart
          cp pubspec.yaml /tmp/backup_app/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_app/AndroidManifest.xml
          flutter create . --project-name absen_guru_nurul_islam
          cp /tmp/backup_app/main.dart lib/main.dart
          cp /tmp/backup_app/pubspec.yaml pubspec.yaml
          cp /tmp/backup_app/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Absen-Guru-Yayasan-Nurul-Islam
          path: build/app/outputs/flutter-apk/app-release.apk
